<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>QA viewport matrix · development only</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 20px;
        background: #ddd;
      }
      iframe {
        display: block;
        height: 850px;
        border: 1px solid #777;
        margin-bottom: 24px;
      }
      select {
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>QA viewport matrix (Chrome iframe viewports)</h1>
    <p>Each frame loads the real app. This is not an iPhone/Safari device test.</p>
    <label
      >Chiều rộng
      <select id="width">
        <option>360</option>
        <option>390</option>
        <option>768</option>
        <option>1024</option>
        <option>1440</option>
      </select></label
    ><iframe id="app-frame" title="App viewport" src="/" width="360"></iframe>
    <script type="module">
      document.querySelector('#width').onchange = (e) =>
        (document.querySelector('iframe').width = e.target.value);
    </script>
  </body>
</html>
