<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#f1f5f2" />
    <title>Không có kết nối — Vui học cùng cô Quỳnh</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
        color: #243d36;
        background: #eff4f1;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
      }
      main {
        width: min(100%, 440px);
        background: #fff;
        border: 1px solid #dfe7e2;
        border-radius: 14px;
        padding: 32px 28px;
        box-shadow: 0 10px 25px #0000000a;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.4;
        margin: 0 0 12px;
      }
      p {
        color: #65766f;
        line-height: 1.7;
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 20px;
        border-radius: 9px;
        background: #235e4a;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #507dca;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hiện chưa có kết nối mạng</h1>
      <p>
        Bảng học liệu và bảng điểm cần Internet để tải dữ liệu mới hoặc lưu thay đổi.
        Hãy kết nối lại rồi thử mở trang. Dữ liệu riêng tư không được lưu ngoại tuyến bởi ứng dụng.
      </p>
      <a href="/">Thử lại</a>
    </main>
  </body>
</html>
