name: Offline CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend and Edge checks, unit tests, build, and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Check frontend and Edge syntax and scoped credential literals
        run: npm run check

      - name: Run curated component and pure unit contracts only
        run: npm run test:ci

      - name: Verify static production build
        run: npm run build

      - name: Inspect new test formatting and run specialist Auth tests
        run: |
          ./node_modules/.bin/prettier --write tests/remember-admin.test.js
          git diff -- tests/remember-admin.test.js
          npm run test:specialist

      - name: Check pinned Prettier format including Edge source
        run: npm run format:check
