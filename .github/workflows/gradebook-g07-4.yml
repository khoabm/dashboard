name: Gradebook G07-4 isolated synthetic restore
on:
  push:
    branches: [test/g07-4-isolated-recovery]
    paths:
      - .github/workflows/gradebook-g07-4.yml
      - tests/cloud/backup-production-restore.mjs
permissions:
  contents: read
concurrency:
  group: gradebook-g07-4-one-shot
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'khoabm/dashboard' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check free public standard runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(gh api repos/khoabm/dashboard --jq .visibility)" = public
      - name: Prepare checksum-pinned age
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gb-age"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 90 \
            --output "$RUNNER_TEMP/gb-age/age.tar.gz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/gb-age/age.tar.gz" | sha256sum --check --status
          tar --no-same-owner -xzf "$RUNNER_TEMP/gb-age/age.tar.gz" -C "$RUNNER_TEMP/gb-age"
          echo "$RUNNER_TEMP/gb-age/age" >> "$GITHUB_PATH"
          echo "GB_TEST_AGE=$RUNNER_TEMP/gb-age/age/age" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/gb-age/age/age" --version
      - name: Start ephemeral PostgreSQL 17.11
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "PGPASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          echo 'PGHOST=127.0.0.1' >> "$GITHUB_ENV"
          echo 'PGPORT=15432' >> "$GITHUB_ENV"
          echo 'PGUSER=postgres' >> "$GITHUB_ENV"
          echo 'GB_QA_DATABASE=gbqa_g074_source' >> "$GITHUB_ENV"
          echo "GB_QA_DEPENDENCIES=$RUNNER_TEMP/gb-g074-dependencies" >> "$GITHUB_ENV"
          docker run -d --name gb-backup-postgres --memory=2g --cpus=2 \
            -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD postgres:17.11-bookworm > /dev/null
          for attempt in {1..20}; do
            if docker exec gb-backup-postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null; then break; fi
            sleep 1
          done
          docker exec gb-backup-postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null
          cat > "$RUNNER_TEMP/gb-g074-pg_restore" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/bin/docker exec -i gb-backup-postgres pg_restore "$@"
          EOF
          chmod 700 "$RUNNER_TEMP/gb-g074-pg_restore"
          echo "GB_TEST_PG_RESTORE=$RUNNER_TEMP/gb-g074-pg_restore" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/gb-g074-dependencies" --no-audit --no-fund --ignore-scripts pg@8.16.3
      - name: Isolated new-format synthetic restore
        run: node tests/cloud/backup-production-restore.mjs
      - name: Cleanup all ephemeral synthetic resources
        if: always()
        run: |
          docker rm -fv gb-backup-postgres > /dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP"/gb-backup-* "$RUNNER_TEMP/gb-age" "$RUNNER_TEMP"/gb-g074-*
