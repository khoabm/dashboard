name: One-shot failed-limit test formatting
on:
  push:
    branches: [fix/gradebook-failed-verification-limit]
    paths: [.github/workflows/gradebook-failed-limit-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'khoabm/dashboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/prettier --write tests/gradebook-edge.test.js tests/gradebook-b3-sql.mjs
      - name: Remove workflow and commit formatted tests
        run: |
          git rm .github/workflows/gradebook-failed-limit-format-once.yml
          git add tests/gradebook-edge.test.js tests/gradebook-b3-sql.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(gradebook): format failed-verification tests and remove temporary formatter'
          git push origin HEAD:fix/gradebook-failed-verification-limit
