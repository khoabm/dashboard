name: Gradebook UI scoped formatter one-shot
on:
  push:
    branches: [feature/gradebook-student-info-ui-false-fix]
    paths: [.github/workflows/gradebook-profile-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/gradebook-student-info-ui-false-fix
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Format only approved files with locked Prettier
        run: |
          test "$(node -p "require('prettier/package.json').version")" = "3.6.2"
          ./node_modules/.bin/prettier --write src/components/gradebook-admin.js src/components/gradebook-scores.js src/styles/gradebook.css
          ./node_modules/.bin/prettier --check src/components/gradebook-admin.js src/components/gradebook-scores.js src/styles/gradebook.css
          git diff --check
          if git diff --name-only | grep -v -E '^(src/components/gradebook-admin\.js|src/components/gradebook-scores\.js|src/styles/gradebook\.css)$'; then exit 1; fi
      - name: Push formatting only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/gradebook-admin.js src/components/gradebook-scores.js src/styles/gradebook.css
          git commit -m "[CF-Pages-Skip] Format Gradebook profile UI corrections"
          git push origin HEAD:refs/heads/feature/gradebook-student-info-ui-false-fix
