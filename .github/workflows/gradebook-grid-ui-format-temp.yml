name: Temporary Gradebook Grid UI Format
on:
  push:
    branches: [feature/gradebook-bulk-grid-20261029]
    paths: [.github/workflows/gradebook-grid-ui-format-temp.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gradebook-bulk-grid-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/components/gradebook-scores.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/gradebook-scores.js
          if ! git diff --cached --quiet; then
            git commit -m "style(gradebook): format explicit score deletion controls"
            git push origin HEAD:feature/gradebook-bulk-grid-20261029
          fi
