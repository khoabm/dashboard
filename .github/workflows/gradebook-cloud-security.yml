name: Gradebook disposable security

on:
  workflow_dispatch:
  push:
    branches: [feature/personal-gradebook]
    paths:
      - .github/workflows/gradebook-cloud-security.yml
      - tests/cloud/**

permissions:
  contents: read

concurrency:
  group: gradebook-disposable-security
  cancel-in-progress: false

jobs:
  disposable:
    if: github.repository == 'khoabm/dashboard' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select changed specialist concerns without repeating accepted suites
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          native=false; connections=false; edge=false; auth=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || grep -Eq '^(supabase/|tests/gradebook/|tests/gradebook-.*-sql.mjs|tests/cloud/native-adapter.mjs)' <<< "$changed"; then
            native=true; connections=true; edge=true; auth=true
          fi
          if grep -Eq '^tests/cloud/(connections|recover).mjs$' <<< "$changed"; then connections=true; fi
          if grep -Eq '^tests/cloud/auth-api.mjs$' <<< "$changed"; then auth=true; fi
          if grep -Eq '^tests/gradebook-edge.test.js$' <<< "$changed"; then edge=true; fi
          for group in native connections edge auth; do echo "$group=${!group}" >> "$GITHUB_OUTPUT"; done
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enforce public standard-runner zero-cost boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(gh api repos/khoabm/dashboard --jq .visibility)" = public
          echo 'Public repository + standard ubuntu-24.04. No artifacts, caches, hosted secrets or paid resources.'
      - name: Prepare disposable PostgreSQL 17 and test-only driver
        id: prepare
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=15432 PGUSER=postgres
          export PGPASSWORD="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD="$PGPASSWORD"
          echo "::add-mask::$PGPASSWORD"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"
          echo 'PGHOST=127.0.0.1' >> "$GITHUB_ENV"
          echo 'PGPORT=15432' >> "$GITHUB_ENV"
          echo 'PGUSER=postgres' >> "$GITHUB_ENV"
          echo "GB_QA_DEPENDENCIES=$RUNNER_TEMP/gb-dependencies" >> "$GITHUB_ENV"
          echo "PGLITE_MODULE_PATH=$GITHUB_WORKSPACE/tests/cloud/native-adapter.mjs" >> "$GITHUB_ENV"
          docker network create gb-security > /dev/null
          docker run -d --name gb-postgres --network gb-security --memory=2g --cpus=2 -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD postgres:17.6-bookworm > /dev/null
          for attempt in {1..20}; do
            test "$(docker inspect gb-postgres --format '{{.State.Running}}')" = true || { echo 'Disposable DB exited; STOP'; exit 1; }
            if docker exec gb-postgres pg_isready -h 127.0.0.1 -U postgres > /dev/null; then break; fi
            sleep 1
          done
          docker exec gb-postgres pg_isready -h 127.0.0.1 -U postgres
          timeout 5 bash -c 'until echo > /dev/tcp/127.0.0.1/15432; do sleep 0.2; done'
          npm install --prefix "$RUNNER_TEMP/gb-dependencies" --no-audit --no-fund --ignore-scripts pg@8.16.3
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Native migration constraints, recovery and replay
        if: ${{ steps.scope.outputs.native == 'true' }}
        run: |
          set -euo pipefail
          for suite in b2 b3 conflicts reveal; do
            export GB_QA_DATABASE="gbqa_$suite"
            node "tests/gradebook-$suite-sql.mjs"
          done
      - name: Independent-connection security and synthetic key recovery
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.scope.outputs.connections == 'true' }}
        env:
          GB_QA_DATABASE: gbqa_connections
        run: node tests/cloud/connections.mjs
      - name: Existing finite Edge fault and signed-preview contracts
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.scope.outputs.edge == 'true' }}
        run: node --test --test-name-pattern 'limiter denial/failure|preview HMAC canonicalization|stale preflight|timeout/cancellation' tests/gradebook-edge.test.js
      - name: Real disposable Supabase Auth and API acceptance
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.scope.outputs.auth == 'true' }}
        env:
          GB_QA_DATABASE: gbqa_auth
        run: node tests/cloud/auth-api.mjs
      - name: Dispose runner-only database
        if: always()
        run: |
          docker rm -fv gb-auth gb-rest gb-postgres > /dev/null 2>&1 || true
          docker network rm gb-security > /dev/null 2>&1 || true
