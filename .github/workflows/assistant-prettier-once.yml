# Temporary, branch-scoped, one-shot formatter; delete after it runs.
name: Assistant UI scoped Prettier one-shot

on:
  push:
    branches:
      - feature/assistant-chat-experience
    paths:
      - .github/workflows/assistant-prettier-once.yml

permissions:
  contents: write

jobs:
  format-only:
    name: Format only the two approved chatbot UI files
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/assistant-chat-experience
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pinned project Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked project dependencies
        run: npm ci

      - name: Ensure Prettier is the exact locked version
        run: |
          test "$(node -p "require('prettier/package.json').version")" = "3.6.2"

      - name: Format only the two approved files
        run: |
          ./node_modules/.bin/prettier --write src/components/board-assistant.js src/styles/board-assistant.css
          ./node_modules/.bin/prettier --check src/components/board-assistant.js src/styles/board-assistant.css
          git diff --check

      - name: Reject unexpected file modifications
        run: |
          set -eu
          git diff --name-only > /tmp/assistant-format-files.txt
          if grep -v -E '^(src/components/board-assistant\.js|src/styles/board-assistant\.css)$' /tmp/assistant-format-files.txt; then
            echo "Unexpected changed file. Aborting." >&2
            exit 1
          fi
          cat /tmp/assistant-format-files.txt

      - name: Commit formatter-only changes back to feature branch
        run: |
          set -eu
          if git diff --quiet; then
            echo "Already formatted; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/board-assistant.js src/styles/board-assistant.css
          git commit -m "[CF-Pages-Skip] Apply pinned Prettier to assistant UI files"
          git push origin HEAD:refs/heads/feature/assistant-chat-experience
