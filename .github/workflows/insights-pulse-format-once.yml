name: Scoped format learning comparison once
on:
  push:
    branches: [feature/ai-learning-insights]
    paths: [.github/workflows/insights-pulse-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/prettier --write src/utils/gradebook-learning-comparison.js
      - name: Remove temporary formatter and commit only scoped change
        run: |
          git rm .github/workflows/insights-pulse-format-once.yml
          git add src/utils/gradebook-learning-comparison.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(insights): format comparison loader and remove temporary workflow'
          git push origin HEAD:feature/ai-learning-insights
