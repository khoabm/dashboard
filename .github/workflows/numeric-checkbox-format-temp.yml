name: Temporary Numeric Checkbox Format
on:
  push:
    branches: [feature/gradebook-bulk-grid-20261029]
    paths: [.github/workflows/numeric-checkbox-format-temp.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gradebook-bulk-grid-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/utils/dom.js src/components/gradebook-scores.js src/components/gradebook-admin.js src/components/student-lookup.js src/components/birth-date-picker.js src/components/post-editor.js src/components/section-editor.js src/styles/editor.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/dom.js src/components/gradebook-scores.js src/components/gradebook-admin.js src/components/student-lookup.js src/components/birth-date-picker.js src/components/post-editor.js src/components/section-editor.js src/styles/editor.css
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): apply pinned formatter to numeric and checkbox controls"
            git push origin HEAD:feature/gradebook-bulk-grid-20261029
          fi
