name: Bounded live production smoke (one-shot)
on:
  push:
    branches:
      - qa/production-release-20261030
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Public URL and API/AI checks (11 requests maximum, no retry)
        run: node tests/production-release-smoke.mjs
