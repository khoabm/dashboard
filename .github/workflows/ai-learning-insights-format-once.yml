name: One-shot AI Learning Insights formatting
on:
  push:
    branches:
      - feature/ai-learning-insights
    paths:
      - .github/workflows/ai-learning-insights-format-once.yml
permissions:
  contents: write
jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only the six changed source/test files
        run: |
          ./node_modules/.bin/prettier --write             src/components/gradebook-learning-insights.js             src/components/student-gradeboard.js             src/styles/gradebook.css             src/utils/gradebook-learning-insights.js             tests/gradebook-learning-insights.test.js             tests/student-gradeboard.test.js
      - name: Remove this one-shot workflow and push a normal commit
        run: |
          git rm .github/workflows/ai-learning-insights-format-once.yml
          git add src/components/gradebook-learning-insights.js src/components/student-gradeboard.js src/styles/gradebook.css src/utils/gradebook-learning-insights.js tests/gradebook-learning-insights.test.js tests/student-gradeboard.test.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(insights): apply pinned Prettier and remove one-shot formatter'
          git push origin HEAD:feature/ai-learning-insights
