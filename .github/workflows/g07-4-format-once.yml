name: One-shot G07-4 Prettier fix
on:
  push:
    branches: [test/g07-4-isolated-recovery]
    paths:
      - .github/workflows/g07-4-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'khoabm/dashboard' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only new synthetic restore harness
        run: |
          set -euo pipefail
          npx --no-install prettier --write tests/cloud/backup-production-restore.mjs
          npx --no-install prettier --check tests/cloud/backup-production-restore.mjs
          test "$(git diff --name-only | wc -l)" -le 1
          git diff --name-only | grep -qx 'tests/cloud/backup-production-restore.mjs'
      - name: Commit exactly formatted test harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/cloud/backup-production-restore.mjs
          git commit -m "style(g07): format isolated recovery harness with pinned Prettier"
          git push origin HEAD:test/g07-4-isolated-recovery
