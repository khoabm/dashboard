name: One-time synthetic XLSX visual specimen
on:
  push:
    branches:
      - feature/gradebook-full-export-sort-20261031
    paths:
      - .github/workflows/gradebook-xlsx-visual-once.yml
permissions:
  contents: read
jobs:
  specimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate bounded synthetic samples via production XLSX encoder
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, mkdirSync } from 'node:fs';
          import { exportRows } from './src/utils/gradebook-export.js';
          import { styledXlsxBytes } from './src/utils/gradebook-xlsx.js';
          const catalog = {
            subjects: [
              ['toan','Toán'], ['van','Ngữ văn'], ['anh','Ngoại ngữ'],
              ['khtn','Khoa học tự nhiên'], ['lsdl','Lịch sử và Địa lý'],
              ['cn','Công nghệ'], ['tin','Tin học'], ['gdcd','GDCD'],
            ].map(([code, displayName]) => ({code, displayName})),
            scoreColumns: [
              ['tx1','Thường xuyên 1'],['tx2','Thường xuyên 2'],['tx3','Thường xuyên 3'],
              ['tx4','Thường xuyên 4'],['tiet','1 tiết'],['gk','Giữa kì'],['ck','Cuối kì'],
            ].map(([code, displayName]) => ({code, displayName})),
          };
          const entries = [
            {id:'1',fullName:'Nguyễn Minh Anh', documentNumber:'001234567',birthDate:'2014-10-12',active:true,
             scores1:[{subjectCode:'toan',columnCode:'tx1',rawScore:'8.12345'},{subjectCode:'van',columnCode:'ck',rawScore:'9'}],
             scores2:[{subjectCode:'toan',columnCode:'tx1',rawScore:'7.25'},{subjectCode:'khtn',columnCode:'gk',rawScore:'0'}]},
            {id:'2',fullName:'Trần Thị Bình', documentNumber:'001234568',birthDate:'2014-04-21',active:false,
             scores1:[{subjectCode:'toan',columnCode:'tx2',rawScore:'6.5'},{subjectCode:'anh',columnCode:'ck',rawScore:'9.75'}],
             scores2:[{subjectCode:'van',columnCode:'ck',rawScore:'8.5'}]},
          ];
          mkdirSync('synthetic-preview', {recursive:true});
          writeFileSync('synthetic-preview/bang-diem-2-hoc-ky.xlsx',styledXlsxBytes(exportRows('scores',entries,catalog),'scores'));
          writeFileSync('synthetic-preview/danh-sach-hoc-sinh.xlsx',styledXlsxBytes(exportRows('students',entries,catalog),'students'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-gradebook-xlsx-visual
          path: synthetic-preview/*.xlsx
          if-no-files-found: error
          retention-days: 1

# One-time rerender after Excel Text (numFmtId 49) hardening.
